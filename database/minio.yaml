services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: user-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Phnom_Penh

    ports:
      - "9002:9000"
      - "9001:9001"

    networks:
      - ravuth-dev-net

    volumes:
      - user_minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  minio-mc:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: user-minio-mc

    depends_on:
      minio:
        condition: service_healthy

    networks:
      - ravuth-dev-net

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/user-media || true &&
      mc anonymous set download local/user-media || true &&
      echo 'MinIO bucket ready: user-media' &&
      exit 0
      "

    restart: "no"

volumes:
  user_minio_data:

networks:
  ravuth-dev-net:
    driver: bridge