server:
  port: ${SERVER_PORT:4046}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:accountservice}
  # Reactive connection runtime (R2DBC)
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5634/account_service}
    username: ${SPRING_R2DBC_USERNAME:account_service}
    password: ${SPRING_R2DBC_PASSWORD:AccountService@2k26}

  # Liquibase startup connection (JDBC)
  datasource:
    url: ${SPRING_JDBC_URL:jdbc:postgresql://localhost:5634/account_service}
    username: ${SPRING_JDBC_USERNAME:account_service}
    password: ${SPRING_JDBC_PASSWORD:AccountService@2k26}

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}

