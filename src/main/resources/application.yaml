# -------------------------
# MinIO Storage media
# -------------------------
storage:
  minio:
    endpoint: ${STRORAGE_MINIO_ENDPOINT:http://localhost:9002}
    accessKey: ${STRORAGE_MINIO_ACCESSKEY:minioadmin}
    secretKey: ${STRORAGE_MINIO_SECRETKEY:minioadmin}
    bucket: ${STRORAGE_MINIO_BUCKET:user-media}
    publicBaseUrl: ${STRORAGE_MINIO_PUBLICBASEURL:http://localhost:9002}
    maxFilesPerUser: ${STRORAGE_MINIO_MAXFILEPERUSER:5}
    maxFilesSizeBytes: ${STRORAGE_MINIO_MAXFILESSIZEBYTES:5000000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.fund.server.accountservice: ${LOG_LEVEL_APP:INFO}
    com.fund.server.owneraccount.exception: ${LOG_LEVEL_EXCEPTION:DEBUG}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}
    org.springframework.boot.autoconfigure.liquibase: ${LOG_LEVEL_LIQUIBASE_AUTO:INFO}
    io.netty.resolver.dns.DnsServerAddressStreamProviders: ${LOG_LEVEL_DNS_SERVER_ADDRESS_STREAM_RPOVIDERS:OFF}

